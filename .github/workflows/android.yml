name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: App icon
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#0b1122' --splashBackgroundColor '#0b1122'
      - run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk laylat-fifa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: laylat-fifa-apk
          path: laylat-fifa.apk
