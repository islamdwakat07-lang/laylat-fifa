name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: App icon
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#0b1122' --splashBackgroundColor '#0b1122'
      - run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk laylat-fifa.apk
      - uses: actions/upload-artifact@v5
        with:
          name: laylat-fifa-apk
          path: laylat-fifa.apk
      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: ليلة فيفا ${{ github.run_number }}
          body: "نزّل ملف laylat-fifa.apk من الأسفل وثبّته على هاتف الأندرويد."
          make_latest: true
          files: laylat-fifa.apk
