<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ليلة فيفا</title>
<meta name="theme-color" content="#0b1122">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ليلة فيفا">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&family=Bebas+Neue&display=swap">
<style>
/* Layout: match-day console — one column, floodlit header, live match card on top, tabbed tables below */
:root{
  --night:#0b1122; --deck:#131b31; --deck2:#1a2440; --line:#283456;
  --chalk:#eef1f8; --mute:#93a0c2;
  --flood:#ffb627; --turf:#2fd08a; --red:#ff5468; --sky:#63a9ff;
  --f-display:'Lalezar','Readex Pro',system-ui,sans-serif;
  --f-body:'Readex Pro',system-ui,'Segoe UI',Tahoma,sans-serif;
  --f-num:'Bebas Neue','Readex Pro',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--flood);outline-offset:2px}
#app{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--flood);letter-spacing:.5px}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--mute);margin-top:6px;letter-spacing:0}
.nav{display:flex;gap:6px;background:var(--deck);padding:4px;border-radius:999px;border:1px solid var(--line)}
.nav button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mute)}
.nav button[aria-pressed="true"]{background:var(--flood);color:#1b1300}

.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px;margin-bottom:16px;
  background:
   radial-gradient(120% 90% at 85% -20%, rgba(255,182,39,.28), transparent 60%),
   repeating-linear-gradient(90deg, #12301f 0 34px, #153823 34px 68px);
  border:1px solid #234a33}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:38px;line-height:1.1;margin:0 0 6px;text-wrap:balance}
.hero p{margin:0;color:#cfe3d6;max-width:46ch}
.hero .line{position:absolute;inset:auto 0 0 auto;width:120px;height:120px;border:2px solid rgba(255,255,255,.18);border-radius:50%;transform:translate(-30%,45%)}

.panel{background:var(--deck);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.count{font-family:var(--f-num);font-size:22px;color:var(--flood);letter-spacing:1px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;background:var(--deck2);border:1px solid var(--line);color:var(--chalk);border-radius:12px;padding:11px 12px;font:inherit}
.btn{background:var(--deck2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.gold{background:var(--flood);border-color:var(--flood);color:#1b1300}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:rgba(255,84,104,.45)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--deck2);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 12px;font-weight:600}
.chip .num{font-family:var(--f-num);color:var(--mute);font-size:16px}
.chip button{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.07);color:var(--mute);font-size:15px;line-height:1}
.chip.add{border-style:dashed;color:var(--mute);padding:6px 12px}
.hint{color:var(--mute);font-size:13px;margin:10px 0 0}
.sub{font-size:13px;color:var(--mute);margin:14px 0 6px;font-weight:600}

.fmts{display:grid;gap:10px}
.fmt{display:block;width:100%;text-align:right;background:var(--deck2);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.fmt[aria-pressed="true"]{border-color:var(--flood);background:linear-gradient(180deg,rgba(255,182,39,.10),var(--deck2))}
.fmt .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fmt .nm{font-family:var(--f-display);font-size:21px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--flood);color:#1b1300}
.fmt p{margin:6px 0 0;color:var(--mute);font-size:13.5px}
.opts{margin-top:12px;display:grid;gap:10px}
.optl{font-size:12.5px;color:var(--mute);margin-bottom:5px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:7px 12px;border-radius:10px;background:var(--deck);border:1px solid var(--line);font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--night);border-color:var(--chalk)}
.est{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--mute)}
.est b{font-family:var(--f-num);font-size:22px;color:var(--chalk);letter-spacing:1px;font-weight:400;margin-inline-start:4px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.toggle+.toggle{border-top:1px solid var(--line)}
.toggle div{min-width:0}
.toggle small{display:block;color:var(--mute);font-size:12.5px}
.sw{width:50px;height:30px;border-radius:999px;background:var(--deck2);border:1px solid var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:var(--mute);transition:transform .2s}
.sw[aria-pressed="true"]{background:var(--turf);border-color:var(--turf)}
.sw[aria-pressed="true"]::after{transform:translateX(-20px);background:#fff}
.cta{display:block;width:100%;font-family:var(--f-display);font-size:24px;padding:14px;border-radius:16px;background:var(--flood);color:#1b1300;box-shadow:0 8px 30px rgba(255,182,39,.28)}
.cta:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}

/* live */
.board{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.board h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;line-height:1.1}
.board .ph{color:var(--mute);font-size:13px}
.prog{flex:none;text-align:left}
.prog b{font-family:var(--f-num);font-size:26px;font-weight:400;letter-spacing:1px}
.bar{height:6px;border-radius:9px;background:var(--deck2);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--turf),var(--flood))}

.match{position:relative;border-radius:22px;padding:16px;margin-bottom:14px;border:1px solid #2c3b66;
  background:radial-gradient(90% 70% at 50% -10%, rgba(99,169,255,.18), transparent 70%), var(--deck)}
.stage{display:flex;justify-content:center;gap:8px;align-items:center;font-size:12.5px;color:var(--mute);font-weight:600;letter-spacing:.3px}
.stage .live{color:var(--red);display:inline-flex;align-items:center;gap:5px}
.stage .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;margin-top:12px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
.pname{font-family:var(--f-display);font-size:24px;line-height:1.15;word-break:break-word}
.tier{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.mid{font-family:var(--f-display);font-size:20px;color:var(--mute);padding-top:64px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:42px;height:42px;border-radius:12px;background:var(--deck2);border:1px solid var(--line);font-size:22px;font-weight:700}
.score{font-family:var(--f-num);font-size:60px;line-height:1;min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.rule{margin:14px auto 0;max-width:100%;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center;background:rgba(255,182,39,.1);border:1px dashed rgba(255,182,39,.5);color:#ffd27a;border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:600}
.rule button{font-size:12px;color:var(--mute);text-decoration:underline}
.h2h{text-align:center;color:var(--mute);font-size:12.5px;margin-top:10px}
.pens{margin-top:12px;text-align:center}
.pens .seg{justify-content:center;margin-top:6px}
.note{text-align:center;font-size:12.5px;color:var(--mute);margin-top:10px}
.match .cta{margin-top:14px}

.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:10px;border-radius:12px;background:var(--deck);border:1px solid var(--line);font-weight:600;color:var(--mute)}
.tabs button[aria-pressed="true"]{color:var(--chalk);border-color:var(--chalk)}
.tblwrap{overflow-x:auto;margin-bottom:12px;border-radius:14px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;background:var(--deck)}
th{font-size:11.5px;color:var(--mute);font-weight:600;text-align:center;padding:8px 6px;background:var(--deck2);white-space:nowrap}
td{padding:9px 6px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
td.nm,th.nm{text-align:right;padding-inline-start:12px}
td.nm{font-weight:600}
td.pts{font-family:var(--f-num);font-size:20px;color:var(--flood)}
tr.q td:first-child{box-shadow:inset -3px 0 0 var(--turf)}
.form{display:inline-flex;gap:3px}
.form i{width:8px;height:8px;border-radius:50%;display:inline-block}
.form .W{background:var(--turf)}.form .D{background:var(--mute)}.form .L{background:var(--red)}
.gtitle{font-family:var(--f-display);font-size:19px;margin:6px 0 8px}

.mlist{display:grid;gap:6px;margin-bottom:14px}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--deck);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.mrow .a{text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere}
.mrow .b{text-align:left;font-weight:600;min-width:0;overflow-wrap:anywhere}
.mrow .s{font-family:var(--f-num);font-size:22px;min-width:64px;text-align:center;letter-spacing:1px}
.mrow.next{border-color:var(--flood)}
.mrow.next .s{color:var(--flood);font-family:var(--f-body);font-size:12px;font-weight:700}
.mrow .win{color:var(--turf)}
.mrow .lose{color:var(--mute);font-weight:500}
.mrow small{grid-column:1/-1;text-align:center;color:var(--mute);font-size:11.5px;margin-top:-2px}

.big2{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;background:var(--deck);border:1px solid var(--line);border-radius:18px;padding:18px 12px;margin-bottom:12px}
.big2 .n{font-family:var(--f-display);font-size:22px;overflow-wrap:anywhere}
.big2 .w{font-family:var(--f-num);font-size:64px;line-height:1}
.pips{display:flex;gap:5px;justify-content:center;margin-top:6px}
.pips i{width:12px;height:12px;border-radius:4px;background:var(--deck2);border:1px solid var(--line)}
.pips i.on{background:var(--flood);border-color:var(--flood)}

.kq{display:grid;gap:8px;margin-bottom:12px}
.krow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--deck);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.krow.king{border-color:var(--flood)}
.krow .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.krow .crown{width:26px;height:26px;display:grid;place-items:center;font-family:var(--f-num);font-size:18px;color:var(--mute)}
.krow.king .crown{color:var(--flood)}

.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:18px}
.confirm{background:var(--deck2);border:1px solid var(--red);border-radius:14px;padding:12px;margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}

/* hall */
.lead{border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid #5b4413;background:radial-gradient(100% 120% at 100% 0%,rgba(255,182,39,.25),transparent 60%),var(--deck)}
.lead .k{font-size:12.5px;color:#ffd27a;font-weight:700;letter-spacing:.3px}
.lead .n{font-family:var(--f-display);font-size:34px;line-height:1.15;margin:4px 0}
.lead p{margin:0;color:var(--mute);font-size:13.5px}
.rank{display:grid;gap:8px;margin-bottom:14px}
.rrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--deck);border:1px solid var(--line);border-radius:14px;padding:12px}
.rrow .pos{font-family:var(--f-num);font-size:26px;color:var(--mute);text-align:center}
.rrow:first-child .pos{color:var(--flood)}
.rrow .n{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.rrow .meta{font-size:12px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.rrow .elo{font-family:var(--f-num);font-size:26px;text-align:left;line-height:1}
.rrow .elo small{display:block;font-family:var(--f-body);font-size:10.5px;color:var(--mute)}
.tbar{height:4px;border-radius:4px;background:var(--deck2);margin-top:6px;overflow:hidden}
.tbar i{display:block;height:100%}
.empty{text-align:center;color:var(--mute);padding:26px 12px;background:var(--deck);border:1px dashed var(--line);border-radius:16px;margin-bottom:14px}
.hist{display:grid;gap:6px}
.hrow{display:flex;justify-content:space-between;gap:10px;background:var(--deck);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.5px}
.hrow span:last-child{color:var(--mute)}

/* overlays */
.flash{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(6,9,20,.82);backdrop-filter:blur(4px);padding:24px;text-align:center}
.flash .t{font-family:var(--f-display);font-size:clamp(44px,13vw,84px);line-height:1.05;color:var(--flood);text-shadow:0 6px 40px rgba(255,182,39,.45);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.flash .r{font-family:var(--f-num);font-size:44px;letter-spacing:2px;margin-top:6px}
.flash .s{color:var(--chalk);font-size:16px;margin-top:6px;max-width:30ch;margin-inline:auto}
.flash .e{display:inline-block;margin-top:12px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(47,208,138,.15);color:var(--turf)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.celebrate{position:fixed;inset:0;z-index:50;overflow:auto;background:radial-gradient(80% 60% at 50% 0%,rgba(255,182,39,.35),transparent 70%),rgba(6,9,20,.94);padding-top:calc(30px + env(safe-area-inset-top,0px));padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cbox{max-width:460px;margin:0 auto;text-align:center;position:relative;z-index:2}
.cbox svg{width:84px;height:84px}
.cbox .k{color:#ffd27a;font-weight:700;letter-spacing:.5px;font-size:13px;margin-top:6px}
.cbox .n{font-family:var(--f-display);font-size:clamp(46px,14vw,72px);line-height:1.05;color:var(--flood);text-shadow:0 6px 40px rgba(255,182,39,.5);overflow-wrap:anywhere}
.cbox .ru{color:var(--mute);margin-top:4px}
.aw{display:grid;gap:8px;margin:20px 0}
.awr{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--deck);border:1px solid var(--line);border-radius:14px;padding:11px 14px;text-align:right}
.awr span:first-child{color:var(--mute);font-size:13px}
.awr b{overflow-wrap:anywhere}
.cbox .acts{display:grid;gap:8px}
.field{width:100%;background:var(--deck2);border:1px solid var(--line);color:var(--chalk);border-radius:12px;padding:11px 12px;font:inherit}
.coin{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-num);font-size:1.15em;letter-spacing:.5px;color:var(--flood)}
.coin::before{content:"";width:.8em;height:.8em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe08a,#ffb627 60%,#c47f00);box-shadow:inset 0 0 0 1.5px #a86b00}
.prize{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(90deg,rgba(255,182,39,.16),rgba(255,182,39,.04));border:1px solid rgba(255,182,39,.45);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.prize span{font-size:11.5px;font-weight:700;color:#1b1300;background:var(--flood);border-radius:999px;padding:2px 8px}
.prize b{font-weight:600}
.prize.big{justify-content:center;margin-top:16px}
.prize.big b{font-family:var(--f-display);font-weight:400;font-size:22px}
.cards{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--deck2)}
.cards summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:13.5px;color:#ffd27a}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px 14px}
.ccol{min-width:0}
.ccol .seg button{font-size:12px;padding:6px 9px}
@media (max-width:440px){.cgrid{grid-template-columns:1fr}}
.fx{display:grid;gap:6px;margin-top:10px}
.fx span{text-align:center;font-size:12.5px;font-weight:600;color:var(--sky);background:rgba(99,169,255,.1);border-radius:10px;padding:6px 10px}
.rw{display:grid;gap:6px;margin-top:16px;max-width:360px;margin-inline:auto}
.rwl{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;animation:pop .5s .2s both cubic-bezier(.2,1.6,.4,1)}
.rwl.up{border-color:var(--turf)}.rwl.bd{border-color:var(--flood);color:#ffd27a}.rwl.pn{border-color:var(--red)}
.tap{margin-top:14px;font-size:12px;color:var(--mute)}
.chip.sel{background:var(--flood);color:#1b1300;border-color:var(--flood);padding:6px 12px}
.shop{display:grid;gap:8px;margin-bottom:16px}
.scard{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--deck);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.scard>div{min-width:0}
.scard .sn{font-family:var(--f-display);font-size:19px}
.scard p{margin:2px 0 0;color:var(--mute);font-size:13px}
.scard .btn{flex:none;min-width:84px}
.scard .btn.gold .coin{color:#1b1300}
.scard .btn:disabled{opacity:.45;cursor:not-allowed}
.own{font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--turf);background:rgba(47,208,138,.12);border-radius:999px;padding:2px 8px;vertical-align:middle}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.bdg{background:var(--deck);border:1px dashed var(--line);border-radius:12px;padding:10px;opacity:.5}
.bdg b{display:block;font-size:14px}.bdg span{font-size:12px;color:var(--mute)}
.bdg.on{opacity:1;border:1px solid var(--flood);background:linear-gradient(180deg,rgba(255,182,39,.14),var(--deck))}
.bdg.on b{color:var(--flood)}
.earn{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}

function recommended(n){return n===2?'series':n===3?'koth':n<=7?'league':'groups'}
function available(n){return Object.keys(FORMATS).filter(k=>n>=FORMATS[k].min&&n<=FORMATS[k].max)}
function optsFor(fmt,n){const saved=(D.opts&&D.opts[fmt])||{},o={};FORMATS[fmt].opts(n).forEach(d=>{const ok=d.choices.some(c=>c[0]===saved[d.key]);o[d.key]=ok?saved[d.key]:d.def});return o}

/* ---------- engine ---------- */
function addMatch(T,a,b,ex){const m=Object.assign({id:T.seq++,a,b,sa:null,sb:null,pen:null,done:false,stage:'league',label:''},ex||{});if(T.chaos)m.rule=pick(RULES);T.matches.push(m);return m}
function byId(T,id){return T.matches.find(m=>m.id===id)}
function winnerOf(m){return m.sa>m.sb?m.a:m.sb>m.sa?m.b:m.pen}
function loserOf(m){const w=winnerOf(m);return w===m.a?m.b:m.a}
function roundRobin(ids){const arr=[...ids];if(arr.length%2)arr.push(null);const n=arr.length,R=[];for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];if(a!=null&&b!=null)pr.push(r%2?[b,a]:[a,b])}R.push(pr);arr.splice(1,0,arr.pop())}return R}
function roundName(s){return{2:'النهائي',4:'نصف النهائي',8:'ربع النهائي',16:'دور الـ16',32:'دور الـ32'}[s]||'الدور'}
function table(T,filter,ids){const rows={};ids.forEach(id=>rows[id]={id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,form:[]});
 T.matches.filter(m=>m.done&&filter(m)).forEach(m=>{const A=rows[m.a],B=rows[m.b];if(!A||!B)return;A.p++;B.p++;A.gf+=m.sa;A.ga+=m.sb;B.gf+=m.sb;B.ga+=m.sa;
  if(m.sa>m.sb){A.w++;B.l++;A.pts+=3;A.form.push('W');B.form.push('L')}else if(m.sb>m.sa){B.w++;A.l++;B.pts+=3;B.form.push('W');A.form.push('L')}else{A.d++;B.d++;A.pts++;B.pts++;A.form.push('D');B.form.push('D')}});
 return Object.values(rows).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||x.id-y.id)}
function startKO(T,list,third){T.ko={third:!!third};buildKO(T,list)}
function buildKO(T,list){const size=list.length,slots=[];for(let i=0;i<size;i+=2){const a=list[i],b=list[i+1],s={a,b,w:null,mid:null};
  if(a==null)s.w=b;else if(b==null)s.w=a;else{const m=addMatch(T,a,b,{stage:'ko',ko:size,label:roundName(size)+(size>2?' · المواجهة '+(i/2+1):'')});s.mid=m.id}slots.push(s)}
 T.ko.slots=slots;T.ko.size=size}
function koAdvance(T){const k=T.ko;k.slots.forEach(s=>{if(s.w==null&&s.mid!=null){const m=byId(T,s.mid);if(m.done)s.w=winnerOf(m)}});
 if(k.slots.some(s=>s.w==null))return;const winners=k.slots.map(s=>s.w);
 if(k.size===2){const fm=byId(T,k.slots[0].mid);return finish(T,winners[0],fm?loserOf(fm):null)}
 if(k.size===4&&k.third){const lo=k.slots.map(s=>{const m=s.mid!=null?byId(T,s.mid):null;return m?loserOf(m):null}).filter(x=>x!=null);if(lo.length===2)addMatch(T,lo[0],lo[1],{stage:'third',label:'مباراة المركز الثالث'})}
 buildKO(T,winners)}
const allIds=T=>T.players.map((_,i)=>i);
const ENG={
 series:{init(T){addMatch(T,0,1,{stage:'series',label:'المباراة 1'})},
  advance(T){const t=Math.ceil(T.opts.bestOf/2),w=[0,0];T.matches.forEach(m=>{if(m.done&&m.sa!==m.sb)w[winnerOf(m)]++});
   if(w[0]>=t)return finish(T,0,1);if(w[1]>=t)return finish(T,1,0);const k=T.matches.length+1;addMatch(T,k%2?0:1,k%2?1:0,{stage:'series',label:'المباراة '+k})}},
 koth:{init(T){const o=shuffle(allIds(T));T.queue=o.slice(2);T.kw=T.players.map(()=>0);T.king=null;T.crown=0;addMatch(T,o[0],o[1],{stage:'koth',label:'الجولة 1'})},
  advance(T,m){let king,loser;if(m.sa>m.sb){king=m.a;loser=m.b}else if(m.sb>m.sa){king=m.b;loser=m.a}else{king=m.b;loser=m.a}
   if(m.sa!==m.sb){T.kw[king]++;T.crown=(T.king===king?T.crown:0)+1}else T.crown=0;T.king=king;
   if(T.kw[king]>=T.opts.target){const r=allIds(T).filter(i=>i!==king).sort((x,y)=>T.kw[y]-T.kw[x])[0];return finish(T,king,r)}
   T.queue.push(loser);const ch=T.queue.shift();addMatch(T,king,ch,{stage:'koth',label:'الجولة '+(T.matches.length+1)})}},
 league:{init(T){const R=roundRobin(shuffle(allIds(T)));R.forEach((pr,r)=>pr.forEach(([a,b])=>addMatch(T,a,b,{stage:'league',label:'الجولة '+(r+1)})));
   if(T.opts.legs===2)R.forEach((pr,r)=>pr.forEach(([a,b])=>addMatch(T,b,a,{stage:'league',label:'الجولة '+(R.length+r+1)})))},
  advance(T){if(T.ko)return koAdvance(T);if(T.matches.some(m=>m.stage==='league'&&!m.done))return;
   const o=table(T,m=>m.stage==='league',allIds(T)).map(r=>r.id),f=T.opts.finale;
   if(f==='none')return finish(T,o[0],o[1]);
   if(f==='final'){if(o.length>=4)addMatch(T,o[2],o[3],{stage:'third',label:'مباراة المركز الثالث'});return startKO(T,[o[0],o[1]],false)}
   startKO(T,[o[0],o[3],o[1],o[2]],true)}},
 groups:{init(T){const ids=shuffle(allIds(T)),G=T.opts.groups,g=Array.from({length:G},()=>[]);ids.forEach((id,i)=>g[i%G].push(id));T.groups=g;
   const R=g.map(x=>roundRobin(x)),mx=Math.max(...R.map(r=>r.length));
   for(let r=0;r<mx;r++)R.forEach((gr,gi)=>(gr[r]||[]).forEach(([a,b])=>addMatch(T,a,b,{stage:'group',group:gi,label:'المجموعة '+GL[gi]+' · الجولة '+(r+1)})))},
  advance(T){if(T.ko)return koAdvance(T);if(T.matches.some(m=>m.stage==='group'&&!m.done))return;
   const tops=T.groups.map((g,gi)=>table(T,m=>m.stage==='group'&&m.group===gi,g).map(r=>r.id)),h1=[],h2=[];
   for(let k=0;k<T.groups.length;k+=2){h1.push(tops[k][0],tops[k+1][1]);h2.push(tops[k+1][0],tops[k][1])}
   startKO(T,h1.concat(h2),!!T.opts.third)}},
 conquest:{init(T){T.cq={st:0,own:MAP.map(()=>({})),crowns:[],chooser:Math.floor(Math.random()*T.players.length),picks:null};
   if(T.players.length%2){const q=shuffle(allIds(T));T.cq.queue=q.slice(2);T.cq.chooser=null;addMatch(T,q[0],q[1],{stage:'cq',label:MAP[0].n+' · المعركة 1'})}},
  advance(T,m){const w=winnerOf(m),l=loserOf(m);T.cq.picks={w,l,left:Math.abs(m.sa-m.sb)>=3?2:1,stole:false};T.cq.chooser=null;T.cq.lastW=w;T.cq.lastL=l;T.cq.streak=(T.cq.kingId===w?(T.cq.streak||0):0)+1;T.cq.kingId=w}},
 knockout:{init(T){const ids=shuffle(allIds(T));let P=1;while(P<ids.length)P*=2;const byes=P-ids.length,pairs=[];let i=0;
   for(let b=0;b<byes;b++)pairs.push([ids[i++],null]);while(i<ids.length){pairs.push([ids[i],ids[i+1]]);i+=2}
   startKO(T,shuffle(pairs).flat(),!!T.opts.third)},
  advance(T){koAdvance(T)}}
};

const PC=['#ffb627','#2fd08a','#63a9ff','#ff5468','#c77dff','#ff8a3d','#3ddbd9','#f15bb5','#a3e635','#f4f1de','#4361ee','#e9c46a','#9d4edd','#06d6a0','#ef476f','#8ecae6','#b5838d','#ffd166','#118ab2','#e76f51'];
function pcol(T,p){return (T.colors&&T.colors[p])||PC[p%PC.length]}
function colorOf(n){D.colors=D.colors||{};const used=[];let res=null;for(const x of D.names){let c=D.colors[x];if(!c||used.includes(c))c=PC.find(k=>!used.includes(k)&&!D.names.some(y=>y!==x&&D.colors[y]===k))||PC[used.length%PC.length];used.push(c);if(x===n)res=c}return res||D.colors[n]||PC[0]}
function palette(act,cur,taken,extra){return `<div class="pal">`+PC.map(c=>`<button class="sw3" style="background:${c}" data-act="${act}" data-c="${c}"${extra} aria-pressed="${c===cur}" ${taken.includes(c)&&c!==cur?'disabled':''} aria-label="لون"></button>`).join('')+`</div>`}
function cqFree(T){const o=T.cq.own[T.cq.st];return MAP[T.cq.st].c.map((_,i)=>i).filter(i=>o[i]==null)}
function cqCount(T,p,s){return Object.values(T.cq.own[s]).filter(x=>x===p).length}
function cqTotal(T,p){return T.cq.own.reduce((a,o)=>a+Object.values(o).filter(x=>x===p).length,0)}
function cqCrowns(T,p){return T.cq.crowns.filter(c=>c.p===p).length}
function cqCanSteal(T){const P=T.cq.picks;return !!P&&!P.stole&&cqCount(T,P.l,T.cq.st)>0}
function cqWeakest(T){const s=T.cq.st;return shuffle(allIds(T)).sort((a,b)=>cqCount(T,a,s)-cqCount(T,b,s)||cqTotal(T,a)-cqTotal(T,b))[0]}
function cqCheck(T){let crowned=null;
 if(!cqFree(T).length){const s=T.cq.st,ids=allIds(T).sort((a,b)=>cqCount(T,b,s)-cqCount(T,a,s)||cqTotal(T,b)-cqTotal(T,a));crowned={s,p:ids[0]};
  T.cq.crowns.push(crowned);hp(T.players[ids[0]].name).coins+=100;T.cq.picks=null;
  if(s===MAP.length-1){const w=allIds(T).sort((a,b)=>cqTotal(T,b)-cqTotal(T,a)||cqCrowns(T,b)-cqCrowns(T,a));finish(T,w[0],w[1]);return crowned}
  T.cq.st++}
 if(T.cq.picks&&T.cq.picks.left<=0)T.cq.picks=null;
 if(!T.cq.picks&&!T.done&&!nextMatch(T)){if(T.cq.queue){T.cq.queue.push(T.cq.lastL);const ch=T.cq.queue.shift();addMatch(T,T.cq.lastW,ch,{stage:'cq',label:MAP[T.cq.st].n+' · المعركة '+(T.matches.length+1)})}else T.cq.chooser=cqWeakest(T)}return crowned}
function cqMap(T){const s=T.cq.st,M=MAP[s],o=T.cq.own[s],P=T.cq.picks,steal=cqCanSteal(T);
 const cls=i=>P?(o[i]==null?'pk':(steal&&o[i]===P.l?'stl':'')):'';const fill=i=>o[i]!=null?pcol(T,o[i]):'var(--free)';
 let g=`<path d="${M.bg}" class="bgl"/>`+M.c.map((c,i)=>`<path d="${c[1]}" fill="${fill(i)}" class="cty ${cls(i)}" data-act="cty" data-i="${i}"><title>${esc(c[0])}</title></path>`).join('');
 g+=M.c.map((c,i)=>c[4]?`<circle cx="${c[2]}" cy="${c[3]}" r="7" fill="${fill(i)}" class="cty dot ${cls(i)}" data-act="cty" data-i="${i}"/>`:'').join('');
 return `<div class="cqmap"><svg viewBox="0 0 ${M.w} ${M.h}" role="img" aria-label="خريطة ${M.n}">${g}</svg></div>`}
function cqTrack(T){return `<div class="track">`+MAP.map((c,i)=>{const cr=T.cq.crowns.find(x=>x.s===i);return `<div class="st ${i===T.cq.st&&!T.done?'now':cr?'done':''}"><b>${i+1}</b><span>${c.n}</span><small>${cr?'♛ '+esc(T.players[cr.p].name):c.c.length+' دولة'}</small></div>`}).join('')+`</div>`}
function cqBar(T){const s=T.cq.st,n=MAP[s].c.length;return `<div class="prog2"><span>دول ${MAP[s].n} المحتلة</span><span>${n-cqFree(T).length} / ${n}</span></div><div class="bar">`+allIds(T).map(p=>`<i style="width:${cqCount(T,p,s)/n*100}%;background:${pcol(T,p)}"></i>`).join('')+`</div>`}
function cqPanel(T){const s=T.cq.st,M=MAP[s],P=T.cq.picks,o=T.cq.own[s];

function record(T,m){const na=T.players[m.a].name,nb=T.players[m.b].name,A=hp(na),B=hp(nb),C=m.cards||{a:[],b:[]};
 const tA=tier(A.elo).name,tB=tier(B.elo).name;
 const ea=1/(1+Math.pow(10,(B.elo-A.elo)/400)),s=m.sa>m.sb?1:m.sa<m.sb?0:.5,df=Math.abs(m.sa-m.sb),mult=df<=1?1:df===2?1.5:(11+df)/8;
 const d=Math.round(32*mult*(s-ea));A.elo+=(d<0&&C.a.includes('shield'))?0:d;B.elo-=(d>0&&C.b.includes('shield'))?0:d;
 const res={d,ea,coins:{},badges:[],promo:[]};
 [[A,na,m.sa,m.sb,ea,C.a,'a'],[B,nb,m.sb,m.sa,1-ea,C.b,'b']].forEach(([P,n,f,a,ex,cd,side])=>{P.p++;P.gf+=f;P.ga+=a;
  if(f>a){P.w++;P.streak++;P.best=Math.max(P.best,P.streak)}else{if(f===a)P.d++;else P.l++;P.streak=0}
  let c=f>a?30:f===a?10:5;if(f>a){if(f-a>=3)c+=15;if(a===0)c+=10;if(ex<.33)c+=25;if(P.streak>=3)c+=5*P.streak}
  if(cd.includes('double'))c*=2;P.coins+=c;res.coins[side]=c;
  if(f>a){if(P.w===1)grant(n,'first',res.badges);if(P.streak>=3)grant(n,'hat',res.badges);if(P.streak>=5)grant(n,'five',res.badges);
   if(f-a>=4)grant(n,'crush',res.badges);if(a===0)grant(n,'clean',res.badges);if(ex<.33)grant(n,'upset',res.badges);if(P.w>=10)grant(n,'ten',res.badges)}
  if(f>=5)grant(n,'fest',res.badges);if(P.p>=50)grant(n,'vet',res.badges);if(P.elo>=1550)grant(n,'gold',res.badges);if(P.elo>=1750)grant(n,'legend',res.badges);if(P.coins>=500)grant(n,'rich',res.badges)});
 [[A,na,tA],[B,nb,tB]].forEach(([P,n,old])=>{const t=tier(P.elo);if(t.name!==old&&TIERS.findIndex(x=>x[1]===t.name)>TIERS.findIndex(x=>x[1]===old))res.promo.push({n,t})});
 const key=[na,nb].sort().join('|'),h=H.h2h[key]||(H.h2h[key]={});const wn=m.sa>m.sb?na:m.sb>m.sa?nb:'=';h[wn]=(h[wn]||0)+1;
 return res}
function h2hLine(na,nb){const h=H.h2h[[na,nb].sort().join('|')];if(!h)return 'أول مواجهة بينهما في السجل';

function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const c=AC.createDynamicsCompressor();MG=AC.createGain();MG.gain.value=.9;MG.connect(c);c.connect(AC.destination)}if(AC.state==='suspended')AC.resume();return AC}
function env(g,T,v,a,d){g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(v,T+a);g.gain.exponentialRampToValueAtTime(.0001,T+d)}
function osc(f,t,d,o){o=o||{};const T=AC.currentTime+t,x=AC.createOscillator(),g=AC.createGain();x.type=o.type||'sine';x.frequency.setValueAtTime(f,T);if(o.f2)x.frequency.exponentialRampToValueAtTime(o.f2,T+d);
 if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.vibF||6;lg.gain.value=o.vib;l.connect(lg);lg.connect(x.frequency);l.start(T);l.stop(T+d+.05)}
 env(g,T,o.v||.15,o.a||.01,d);x.connect(g);g.connect(MG);x.start(T);x.stop(T+d+.05)}
function bufs(){if(NB)return;const n=AC.sampleRate*2;NB=AC.createBuffer(1,n,AC.sampleRate);WB=AC.createBuffer(1,n,AC.sampleRate);const a=NB.getChannelData(0),b=WB.getChannelData(0);let last=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;b[i]=w;last=(last+.02*w)/1.02;a[i]=last*3.5}}
function noise(t,d,o){o=o||{};bufs();const T=AC.currentTime+t,src=AC.createBufferSource();src.buffer=o.white?WB:NB;src.loop=true;const fl=AC.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.value=o.f||1000;fl.Q.value=o.q||1;
 const g=AC.createGain();env(g,T,o.v||.3,o.a||.02,d);if(o.lfo){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.lfo;lg.gain.value=(o.v||.3)*.35;l.connect(lg);lg.connect(g.gain);l.start(T);l.stop(T+d)}
 src.connect(fl);fl.connect(g);g.connect(MG);src.start(T,Math.random());src.stop(T+d+.05)}
function brass(f,t,d,v){const T=AC.currentTime+t,lp=AC.createBiquadFilter(),g=AC.createGain();lp.type='lowpass';lp.Q.value=2;lp.frequency.setValueAtTime(500,T);lp.frequency.linearRampToValueAtTime(2600,T+.06);lp.frequency.linearRampToValueAtTime(1400,T+d);
 env(g,T,v||.12,.03,d);lp.connect(g);g.connect(MG);[-6,6].forEach(dt=>{const x=AC.createOscillator();x.type='sawtooth';x.frequency.value=f;x.detune.value=dt;x.connect(lp);x.start(T);x.stop(T+d+.05)})}
function drum(t,v){osc(130,t,.4,{f2:42,v:v||.6,a:.004});noise(t,.12,{type:'lowpass',f:900,v:(v||.6)*.4,a:.003})}
function cymbal(t,d,v){noise(t,d||1.4,{white:true,type:'highpass',f:6500,q:.6,v:v||.12,a:.005})}
function crowd(t,d,v){noise(t,d,{f:850,q:.6,v:v||.35,a:.35,lfo:6});noise(t+.05,d,{f:2100,q:.8,v:(v||.35)*.35,a:.4,lfo:9})}

 capture(){drum(0,.5);[[392,0,.13],[523,.13,.13],[659,.26,.13],[784,.39,.6]].forEach(([f,t,d])=>brass(f,t,d,.11));cymbal(.39,1)},
 fall(){drum(0,.75);drum(.28,.75);brass(294,0,.22,.13);brass(294,.28,.22,.13);brass(233,.56,1.2,.15);brass(117,.56,1.2,.08);drum(.56,.9);cymbal(.56,1.6,.14)},
 crown(){drum(0,.6);[[523,0,.16],[659,.16,.16],[784,.32,.16],[1047,.48,.9]].forEach(([f,t,d])=>brass(f,t,d,.11));[523,659,784].forEach(f=>brass(f,.48,.9,.06));cymbal(.48,1.8,.15);crowd(.5,2.2,.3)},
 fanfare(){const N=[[523,0,.14],[523,.15,.14],[523,.3,.14],[698,.45,.45],[880,.95,.14],[784,1.1,.14],[880,1.25,.14],[1047,1.4,1.1]];N.forEach(([f,t,d])=>brass(f,t,d,.11));[523,659,784].forEach(f=>brass(f,1.4,1.1,.05));
  [0,.45,1.4].forEach(t=>drum(t,.6));cymbal(1.4,2,.16);crowd(.2,3.2,.36)},

 if(big){const w=winnerOf(big.m);out.push(['أكبر انتصار',`${T.players[w].name} ${Math.max(big.m.sa,big.m.sb)}-${Math.min(big.m.sa,big.m.sb)} على ${T.players[loserOf(big.m)].name}`])}
 return out}
function celebrate(){const T=S;if(!T||!T.done)return;const cn=T.players[T.champ].name,P=hp(cn),t=tier(P.elo);
 ov.innerHTML=`<div class="celebrate"><div class="cbox">${CROWN}<div class="k">بطل ${FORMATS[T.fmt].name}</div><div class="n">${esc(cn)}</div>
 <div class="ru">${T.runner!=null?'الوصيف: '+esc(T.players[T.runner].name)+' · ':''}اللقب رقم ${P.titles} في مسيرته</div>
 ${T.prize?`<div class="prize big"><span>الجائزة</span><b>${esc(T.prize)}</b></div>`:''}
 <div class="aw"><div class="awr"><span>مكافأة اللقب</span><b><span class="coin">+200</span> · الرصيد ${P.coins}</b></div>${(T.endBadges||[]).map(b=>`<div class="awr"><span>وسام جديد</span><b>${BADGES[b.k][0]}</b></div>`).join('')}${T.runner!=null?`<div class="awr"><span>مكافأة الوصيف</span><b>${esc(T.players[T.runner].name)} <span class="coin">+80</span></b></div>`:''}<div class="awr"><span>التصنيف</span><b><span class="tier" style="color:${t.color}">${t.name}</span> ${P.elo}</b></div>${awards(T).map(a=>`<div class="awr"><span>${a[0]}</span><b>${esc(a[1])}</b></div>`).join('')}</div>
 <div class="acts"><button class="cta" data-act="rematch">جولة الثأر بنفس اللاعبين</button><button class="btn" data-act="go" data-v="hall">لوحة الشرف</button><button class="btn ghost" data-act="close">إغلاق</button></div></div></div>`;
 confetti()}
let cfRun=0;function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=$('#confetti'),x=c.getContext('2d');c.hidden=false;const W=c.width=innerWidth*devicePixelRatio,Hh=c.height=innerHeight*devicePixelRatio;
 const cols=['#ffb627','#2fd08a','#63a9ff','#ff5468','#eef1f8'],ps=Array.from({length:160},()=>({x:Math.random()*W,y:-Math.random()*Hh*.6,vx:(Math.random()-.5)*3*devicePixelRatio,vy:(2+Math.random()*4)*devicePixelRatio,r:Math.random()*6,s:(4+Math.random()*6)*devicePixelRatio,c:pick(cols)}));
 const id=++cfRun,t0=performance.now();(function f(t){if(id!==cfRun)return;x.clearRect(0,0,W,Hh);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
  if(t-t0<5000)requestAnimationFrame(f);else{x.clearRect(0,0,W,Hh);c.hidden=true}})(t0)}


/* ---------- linking phones (rooms) ---------- */
const SYNC={ok:false,code:null,rev:-1,ref:null,online:false,last:null,pending:null};
function fbReady(){return typeof firebase!=='undefined'&&window.FIREBASE_CONFIG&&FIREBASE_CONFIG.databaseURL&&!/ضع/.test(FIREBASE_CONFIG.apiKey||'ضع')}
function syncInit(){if(!fbReady())return;try{if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);SYNC.db=firebase.database();SYNC.ok=true;
 SYNC.db.ref('.info/connected').on('value',x=>{SYNC.online=!!x.val();render()});const c=store.get('fn_room',null);if(c)joinRoom(c)}catch(e){SYNC.ok=false}}
function payload(){return JSON.stringify({S,H,U:U.slice(-8)})}
function joinRoom(code){if(SYNC.ref)SYNC.ref.off();SYNC.code=code;store.set('fn_room',code);SYNC.rev=-1;SYNC.last=null;SYNC.ref=SYNC.db.ref('rooms/'+code);
 SYNC.ref.on('value',snap=>{const v=snap.val();if(!v){if(SYNC.rev<0){SYNC.rev=0;syncPush(true)}return}
  if(v.rev===SYNC.rev)return;if(SYNC.pending&&v.data===SYNC.pending){SYNC.rev=v.rev;SYNC.last=v.data;return}applyRemote(v)},()=>toast('تعذّر الاتصال بالغرفة. تأكد من الإنترنت.'))}
function leaveRoom(){if(SYNC.ref)SYNC.ref.off();SYNC.ref=null;SYNC.code=null;SYNC.rev=-1;store.set('fn_room',null)}
function syncPush(force){if(!SYNC.ok||!SYNC.ref||SYNC.rev<0)return;const p=payload();if(!force&&p===SYNC.last)return;const base=SYNC.rev;SYNC.pending=p;
 SYNC.ref.transaction(cur=>{if(cur&&cur.rev!==base)return;return{rev:base+1,data:p,by:D.me||'',t:Date.now()}},(err,ok,snap)=>{SYNC.pending=null;
  if(err){toast('لم يُحفظ التعديل في الغرفة. حاول مرة أخرى.');return}const v=snap&&snap.val();
  if(ok&&v){SYNC.rev=v.rev;SYNC.last=v.data}else if(v){applyRemote(v);toast('سبقك هاتف آخر بتعديل، فتحدّثت الشاشة. أعد خطوتك إن لزم.')}},false)}
function applyRemote(v){let o;try{o=JSON.parse(v.data)}catch(e){return}const old=S;SYNC.rev=v.rev;SYNC.last=v.data;
 S=o.S||null;H=o.H||{p:{},h2h:{},hist:[]};U=o.U||[];store.set('fn_t',S);store.set('fn_h',H);store.set('fn_u',U);
 if(S&&!S.done&&view==='setup')view='live';if(!S&&view==='live')view='setup';render();notify(old,S,v.by)}
function notify(old,n,by){if(!n)return;const same=old&&old.created===n.created;
 if(!same){toast((by?by+' ':'')+'بدأ '+(n.fmt==='conquest'?'حملة جديدة':'بطولة جديدة')+' في الغرفة');return}
 const me=n.players.findIndex(p=>p.name===D.me);
 if(n.fmt==='conquest'&&old.cq&&n.cq&&me>=0){const lost=[];n.cq.own.forEach((o,s)=>{const oo=old.cq.own[s]||{};for(const i in oo)if(oo[i]===me&&o[i]!=null&&o[i]!==me)lost.push([s,i,o[i]])});
  if(lost.length){const [s,i,w]=lost[0];try{navigator.vibrate&&navigator.vibrate([300,120,300,120,500])}catch(e){}sound('alert');setTimeout(()=>sound('fall'),900);
   FX=[`<div class="rwl pn">انتُزعت منك يا ${esc(n.players[me].name)}</div>`];flash(`سقطت ${esc(MAP[s].c[i][0])}!`,'',`سقطت دولة ${esc(MAP[s].c[i][0])} بيد ${esc(n.players[w].name)}`,'');return}}
 if(n.fmt==='conquest'&&old.cq&&n.cq){let msg=null,snd='capture';n.cq.own.forEach((o,s)=>{const oo=old.cq.own[s]||{};for(const i in o){if(oo[i]===o[i])continue;const c=MAP[s].c[i][0],w=n.players[o[i]].name;
   if(oo[i]!=null){msg=`سقطت دولة ${c} بيد ${w}`;snd='fall'}else if(!msg)msg=`${w} رفع رايته على ${c}`}});
  const cr=n.cq.crowns.length>old.cq.crowns.length?n.cq.crowns[n.cq.crowns.length-1]:null;
  if(cr){sound('crown');toast(`تاج ${MAP[cr.s].n} لـ ${n.players[cr.p].name}! تُفتح الآن ${MAP[Math.min(cr.s+1,MAP.length-1)].n}`);return}
  if(msg){sound(snd);toast(msg);return}}
 if(n.done&&!old.done){sound('fanfare');celebrate();return}
 const dn=x=>x.matches.filter(m=>m.done).length;if(dn(n)>dn(old)){const m=n.matches.filter(m=>m.done).sort((a,b)=>b.id-a.id)[0];
  sound('whistle');toast(`نتيجة جديدة: ${n.players[m.a].name} ${m.sa} - ${m.sb} ${n.players[m.b].name}`)}
 if(n.fmt==='conquest'&&n.cq&&me>=0&&n.cq.chooser===me&&old.cq&&old.cq.chooser!==me){sound('alert');toast('دورك! اختر خصمك في المعركة القادمة')}}
let toastT=null;function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}
 t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},4200)}
function room(){
 if(!SYNC.ok)return `<section class="panel"><h2>ربط الهواتف</h2><p class="hint" style="margin:0">${typeof firebase==='undefined'?'الربط يعمل في نسخة التطبيق المثبّتة على الهاتف (APK أو الآيفون) وعند وجود إنترنت.':'لم يُضبط الربط بعد. ضع إعدادات Firebase في ملف firebase-config.js ثم أعد بناء التطبيق.'}</p></section>`;
 const names=(S?S.players.map(p=>p.name):D.names);
 if(SYNC.code)return `<section class="lead"><div class="k">رمز الغرفة</div><div class="n" style="font-family:var(--f-num);letter-spacing:6px;font-size:52px">${esc(SYNC.code)}</div><p><span class="sdot ${SYNC.online?'on':'off'}"></span>${SYNC.online?'متصل: كل تعديل يظهر عند الجميع فوراً':'غير متصل الآن. التعديلات تُرسل عند عودة الإنترنت.'}</p></section>
 <section class="panel"><h2>من أنت؟</h2><p class="hint" style="margin:0 0 10px">اختر اسمك ليصلك تنبيه عندما ينتزع أحد دولة منك أو يحين دورك.</p><div class="chips">${names.map(n=>`<button class="chip ${D.me===n?'sel':'add'}" data-act="me" data-n="${esc(n)}">${esc(n)}</button>`).join('')||'<span class="hint">أضف اللاعبين أولاً.</span>'}</div></section>
 <section class="panel"><h2>دعوة الأصدقاء</h2><p class="hint" style="margin:0">أرسل لهم الرمز <b style="color:var(--chalk)">${esc(SYNC.code)}</b>. كل واحد يفتح التطبيق على هاتفه، يذهب إلى «الغرفة»، يكتب الرمز ويضغط «ادخل».</p></section>
 <button class="btn danger" data-act="ask" data-q="leave">مغادرة الغرفة</button>${ui.ask==='leave'?`<div class="confirm"><span>مغادرة الغرفة؟ تبقى نسخة من البطولة على هاتفك فقط.</span><span style="display:flex;gap:8px"><button class="btn" data-act="ask" data-q="">رجوع</button><button class="btn danger" data-act="leaveroom">غادر</button></span></div>`:''}`;
 return `<section class="panel"><h2>أنشئ غرفة</h2><p class="hint" style="margin:0 0 10px">تُنقل بطولتك الحالية ولوحة الشرف إلى الغرفة، ويحصل كل من يدخلها على نفس البيانات مباشرة.</p><button class="cta" data-act="mkroom">أنشئ غرفة جديدة</button></section>
 <section class="panel"><h2>ادخل غرفة صديقك</h2><div class="addrow"><input id="rcode" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="رمز الغرفة" aria-label="رمز الغرفة"><button class="btn gold" data-act="joinroom">ادخل</button></div><p class="hint">عند الدخول تُستبدل بيانات هاتفك ببيانات الغرفة.</p></section>`}

/* ---------- actions ---------- */
function snap(){U.push(JSON.stringify({S,H}));if(U.length>25)U.shift()}
document.addEventListener('submit',e=>{if(e.target.id!=='addForm')return;e.preventDefault();const v=$('#pname').value.trim().replace(/\s+/g,' ');if(!v)return;
 if(D.sample){D.names=[];D.sample=false}if(D.names.includes(v)){$('#pname').value='';$('#pname').placeholder='الاسم موجود مسبقاً';return}
 if(D.names.length>=20){$('#pname').value='';$('#pname').placeholder='الحد الأقصى 20 لاعباً';return}
 D.names.push(v);save();render();$('#pname').focus()});
document.addEventListener('input',e=>{if(e.target.id==='prize'){D.prize=e.target.value;save()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(['go','tab','fmt','opt','tg','me','pcol','tcolf','card','pen','shopp','cqvs','ask','addk','rm','prz','setcol','tcol'].includes(a))sound('tap');
 if(a==='close'){if(b.classList.contains('flash')||b.tagName==='BUTTON'){ov.innerHTML='';cfRun++;$('#confetti').hidden=true}return}
 if(a==='go'){view=b.dataset.v;ui.ask=null;ov.innerHTML='';cfRun++;$('#confetti').hidden=true}
 else if(a==='rm'){D.names.splice(+b.dataset.i,1);D.sample=false;ui.colorFor=null}
 else if(a==='addk'){if(D.sample){D.names=[];D.sample=false}if(D.names.length<20&&!D.names.includes(b.dataset.n))D.names.push(b.dataset.n)}
 else if(a==='shuf')D.names=shuffle(D.names);
 else if(a==='clr'){D.names=[];D.sample=false}
 else if(a==='fmt')D.fmt=b.dataset.f;
 else if(a==='opt'){D.opts[b.dataset.f]=Object.assign(optsFor(b.dataset.f,D.names.length),{[b.dataset.k]:JSON.parse(b.dataset.v)})}
 else if(a==='tg')D[b.dataset.k]=!D[b.dataset.k];
 else if(a==='start'){const n=D.names.length;if(n<2)return;const f=available(n).includes(D.fmt)?D.fmt:recommended(n);S=newT(f,D.names,optsFor(f,n),D.chaos,D.prize,D.punish);S.colors=D.names.map(colorOf);U=[];view='live';tab='table';ui={mid:null,sa:0,sb:0,pen:null,ask:null};scrollTo(0,0)}
 else if(a==='rematch'){const T=S;S=newT(T.fmt,T.players.map(p=>p.name),T.opts,T.chaos,T.prize,T.punish);S.colors=T.players.map((p,i)=>pcol(T,i));U=[];view='live';ov.innerHTML='';cfRun++;$('#confetti').hidden=true;ui={mid:null,sa:0,sb:0,pen:null,ask:null};scrollTo(0,0)}
 else if(a==='sc'){const k=b.dataset.s;ui[k]=Math.max(0,Math.min(30,ui[k]+ +b.dataset.d));if(ui.sa!==ui.sb)ui.pen=null;sound(+b.dataset.d>0?'goal':'minus')}
 else if(a==='pen')ui.pen=+b.dataset.p;
 else if(a==='reroll'){const m=nextMatch(S);if(m){let r;do r=pick(RULES);while(r===m.rule);m.rule=r}}
 else if(a==='mkroom'){if(SYNC.ok)joinRoom(String(10000+Math.floor(Math.random()*90000)))}
 else if(a==='joinroom'){const c=(($('#rcode')||{}).value||'').trim();if(!/^\d{4,6}$/.test(c)){toast('اكتب رمز الغرفة: أرقام فقط.');return}if(SYNC.ok)joinRoom(c)}
 else if(a==='leaveroom'){leaveRoom();ui.ask=null}
 else if(a==='me'){D.me=b.dataset.n}
 else if(a==='pcol'){const i=+b.dataset.i;ui.colorFor=ui.colorFor===i?null:i}
 else if(a==='setcol'){const nm=D.names[+b.dataset.i];D.colors=D.colors||{};if(nm)D.colors[nm]=b.dataset.c;ui.colorFor=null}
 else if(a==='tcolf'){const p=+b.dataset.p;ui.tcol=ui.tcol===p?null:p}
 else if(a==='tcol'){const T=S,p=+b.dataset.p;T.colors=allIds(T).map(i=>pcol(T,i));T.colors[p]=b.dataset.c;D.colors=D.colors||{};D.colors[T.players[p].name]=b.dataset.c;ui.tcol=null}
 else if(a==='cqvs'){const T=S;if(T.cq.chooser==null)return;const s=T.cq.st,k=T.matches.length+1;addMatch(T,T.cq.chooser,+b.dataset.p,{stage:'cq',label:MAP[s].n+' · المعركة '+k});T.cq.chooser=null;ui.info=null}
 else if(a==='cty'){const T=S;if(!T||T.fmt!=='conquest')return;const P=T.cq.picks,i=+b.dataset.i,s=T.cq.st,o=T.cq.own[s];ui.info=i;
  if(P&&(o[i]==null||(o[i]===P.l&&cqCanSteal(T)))){snap();const was=o[i];o[i]=P.w;P.left--;if(was!=null)P.stole=true;ui.info=null;const cr=cqCheck(T);save();render();
   if(T.done){sound('fanfare');celebrate();return}
   if(cr){sound('crown');FX=[`<div class="rwl bd">+100 عملة لصاحب التاج</div>`];flash('تاج '+MAP[cr.s].n+'!','',`${esc(T.players[cr.p].name)} صاحب أكثر دول ${MAP[cr.s].n}. تُفتح الآن ${MAP[T.cq.st].n}`,'');return}
   const cn=esc(MAP[s].c[i][0]),wn=esc(T.players[P.w].name);
   if(was!=null){sound('fall');FX=[`<div class="rwl pn">انتُزعت من ${esc(T.players[was].name)}</div>`];flash(`سقطت ${cn}!`,'',`سقطت دولة ${cn} بيد ${wn}`,'');return}
   sound('capture');toast(`${T.players[P.w].name} رفع رايته على ${MAP[s].c[i][0]}`);return}}
 else if(a==='card'){const k=b.dataset.s,c=b.dataset.c,i=ui[k].indexOf(c);if(i>=0)ui[k].splice(i,1);else ui[k].push(c);if(c==='golden')ui.pen=null}
 else if(a==='prz'){D.prize=b.dataset.v}
 else if(a==='shopp'){ui.shopP=b.dataset.n;ui.bought=null}
 else if(a==='buy'){const P=hp(ui.shopP),c=CARDS[b.dataset.c];if(P.coins>=c.p){P.coins-=c.p;P.cards[b.dataset.c]=(P.cards[b.dataset.c]||0)+1;ui.bought=`تم شراء «${c.n}» لـ ${ui.shopP}. يظهر في بطاقات القوة قبل مباراته.`;sound('coin')}}
 else if(a==='confirm'){const T=S,m=nextMatch(T);if(!m)return;const ko=m.stage==='ko'||m.stage==='third'||m.stage==='cq';
  const fa=ui.sa+(ui.ca.includes('golden')?1:0),fb=ui.sb+(ui.cb.includes('golden')?1:0);if(ko&&fa===fb&&ui.pen==null)return;
  snap();const na=T.players[m.a].name,nb=T.players[m.b].name;
  m.cards={a:ui.ca.filter(c=>hp(na).cards[c]>0),b:ui.cb.filter(c=>hp(nb).cards[c]>0)};m.cards.a.forEach(c=>hp(na).cards[c]--);m.cards.b.forEach(c=>hp(nb).cards[c]--);
  m.sa=ui.sa+(m.cards.a.includes('golden')?1:0);m.sb=ui.sb+(m.cards.b.includes('golden')?1:0);m.pen=ko&&m.sa===m.sb?ui.pen:null;m.done=true;const res=record(T,m);ENG[T.fmt].advance(T,m);
  const out=m.stage==='ko'&&m.ko>2?loserOf(m):null;ui.mid=null;save();render();
  if(T.done){sound('fanfare');celebrate()}else{sound('whistle');hype(T,m,res,out)}return}
 else if(a==='undo'){sound('undo');const u=U.pop();if(u){const o=JSON.parse(u);S=o.S;H=o.H;ui.mid=null;ov.innerHTML='';view='live'}}
 else if(a==='tab')tab=b.dataset.t;
 else if(a==='ask')ui.ask=b.dataset.q||null;
 else if(a==='end'){S=null;U=[];view='setup';ui.ask=null}
 else if(a==='reset'){H={p:{},h2h:{},hist:[]};ui.ask=null}
 else if(a==='celeb'){celebrate();return}
 save();render()});
syncInit();render();
})();
